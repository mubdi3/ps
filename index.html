<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>مركز المبدع :: PS4 Exploit Host</title>
  <style>
    :root {
      --void: #060404;
      --panel: #0d0707;
      --line: #2a1010;
      --red: #ff1435;
      --red-dim: #7a0d1f;
      --red-glow: rgba(255, 20, 53, 0.45);
      --cyan-ghost: #00e5ff;
      --magenta-ghost: #ff2fd0;
      --ink: #d8c9c9;
      --ink-dim: #6b5555;
    }

    * { box-sizing: border-box; }

    body {
      background: var(--void);
      color: var(--ink);
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: 'JetBrains Mono', 'Courier New', 'Consolas', monospace;
      text-align: center;
      padding: 40px 20px;
      position: relative;
      overflow-x: hidden;
    }

    /* grid + vignette backdrop */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse at 50% 20%, rgba(255, 20, 53, 0.12), transparent 55%),
        linear-gradient(rgba(255, 20, 53, 0.05) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 20, 53, 0.05) 1px, transparent 1px);
      background-size: 100% 100%, 42px 42px, 42px 42px;
      pointer-events: none;
      z-index: 0;
    }

    /* CRT scanlines */
    body::after {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 9999;
      background: repeating-linear-gradient(
        0deg, transparent, transparent 2px,
        rgba(255, 20, 53, 0.025) 2px, rgba(255, 20, 53, 0.025) 4px
      );
      mix-blend-mode: screen;
    }

    .hud-frame { position: fixed; inset: 10px; z-index: 2; pointer-events: none; border: 1px solid rgba(255, 20, 53, 0.15); }
    .hud-frame::before, .hud-frame::after {
      content: ""; position: absolute; width: 22px; height: 22px;
      border: 2px solid var(--red); filter: drop-shadow(0 0 6px var(--red-glow));
    }
    .hud-frame::before { top: -2px; left: -2px; border-right: none; border-bottom: none; }
    .hud-frame::after { bottom: -2px; right: -2px; border-left: none; border-top: none; }

    main { position: relative; z-index: 1; max-width: 640px; width: 100%; }

    .hologram-title {
      position: relative;
      display: inline-block;
      margin: 0 auto 10px;
      padding: 16px 40px;
      border: 1px solid rgba(255, 20, 53, 0.5);
      background: rgba(255, 20, 53, 0.06);
      box-shadow: 0 0 20px var(--red-glow), inset 0 0 25px rgba(255, 20, 53, 0.08);
      overflow: hidden;
      clip-path: polygon(14px 0, 100% 0, 100% calc(100% - 14px), calc(100% - 14px) 100%, 0 100%, 0 14px);
    }

    .hologram-title span[data-text] {
      position: relative;
      display: inline-block;
      font-size: 22px;
      font-weight: 700;
      letter-spacing: 5px;
      text-transform: uppercase;
      color: var(--red);
      text-shadow: 0 0 6px var(--red-glow), 0 0 18px var(--red-glow);
      animation: flicker 4s infinite;
    }

    .hologram-title span[data-text]::before,
    .hologram-title span[data-text]::after {
      content: attr(data-text);
      position: absolute; top: 0; left: 0; width: 100%;
      opacity: 0; filter: blur(0.5px);
    }
    .hologram-title span[data-text]::before {
      color: var(--cyan-ghost);
      animation: glitchBefore 3.2s infinite;
      clip-path: inset(0 0 55% 0);
    }
    .hologram-title span[data-text]::after {
      color: var(--magenta-ghost);
      animation: glitchAfter 3.2s infinite;
      clip-path: inset(55% 0 0 0);
    }

    .hologram-title .scan-line {
      position: absolute; left: 4%; width: 92%; height: 2px;
      background: linear-gradient(to right, transparent, var(--red), transparent);
      filter: blur(1px) drop-shadow(0 0 6px var(--red));
      top: 0;
      animation: scan 2.4s linear infinite;
    }

    @keyframes flicker {
      0%, 92%, 100% { opacity: 1; }
      93% { opacity: 0.55; }
      94% { opacity: 1; }
      95% { opacity: 0.35; }
      96% { opacity: 1; }
    }
    @keyframes glitchBefore {
      0%, 88%, 100% { opacity: 0; transform: translateX(0); }
      90% { opacity: 0.7; transform: translateX(-3px); }
      92% { opacity: 0; }
    }
    @keyframes glitchAfter {
      0%, 88%, 100% { opacity: 0; transform: translateX(0); }
      90% { opacity: 0.6; transform: translateX(3px); }
      92% { opacity: 0; }
    }
    @keyframes scan { 0% { top: 0; } 100% { top: 100%; } }

    .subtitle {
      color: var(--ink-dim);
      font-size: 12px;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin: 18px 0 32px;
    }

    .choice-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 18px;
      justify-content: center;
    }

    .btn {
      position: relative;
      flex: 1 1 240px;
      max-width: 280px;
      padding: 24px 20px;
      border: 2px solid var(--red);
      background: rgba(255, 20, 53, 0.06);
      color: var(--ink);
      text-decoration: none;
      border-radius: 3px;
      box-shadow: 0 0 15px var(--red-glow), inset 0 0 10px rgba(255, 20, 53, 0.06);
      overflow: hidden;
      transition: all 0.3s ease;
      text-align: left;
    }

    .btn::before {
      content: "";
      position: absolute; inset: 0;
      background: linear-gradient(90deg, transparent, rgba(255, 20, 53, 0.25), transparent);
      transform: translateX(-100%);
      transition: transform 0.5s;
    }
    .btn:hover::before { transform: translateX(100%); }
    .btn:hover {
      background: rgba(255, 20, 53, 0.14);
      box-shadow: 0 0 25px var(--red-glow), 0 0 45px rgba(255, 20, 53, 0.15);
      transform: translateY(-2px);
    }

    .btn .tag {
      display: block;
      font-size: 10px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--cyan-ghost);
      text-shadow: 0 0 6px rgba(0, 229, 255, 0.4);
      margin-bottom: 8px;
    }

    .btn .label {
      display: block;
      font-size: 17px;
      font-weight: 700;
      letter-spacing: 1px;
      color: var(--red);
      text-shadow: 0 0 6px var(--red-glow);
      margin-bottom: 6px;
    }

    .btn .range {
      display: block;
      font-size: 12px;
      color: var(--ink-dim);
      letter-spacing: 1px;
    }

    .btn .arrow {
      position: absolute;
      right: 16px;
      bottom: 14px;
      color: var(--red);
      font-size: 14px;
      opacity: 0.7;
    }

    footer {
      position: relative;
      z-index: 1;
      margin-top: 40px;
      font-size: 10px;
      letter-spacing: 1px;
      color: var(--ink-dim);
    }

    @media (max-width: 560px) {
      .hologram-title span[data-text] { font-size: 15px; letter-spacing: 3px; }
      .hologram-title { padding: 12px 22px; }
      .choice-grid { flex-direction: column; align-items: center; }
      .btn { width: 100%; max-width: 320px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: 0.001ms !important; animation-iteration-count: 1 !important; }
    }
  </style>
</head>
<body>

<div class="hud-frame"></div>

<main>
  <h1 class="hologram-title">
    <span class="scan-line"></span>
    <span data-text="مركز المبدع">مركز المبدع</span>
  </h1>
  <p class="subtitle">PS4 Exploit Host — pilih versi firmware</p>

  <div class="choice-grid">
    <a href="v1/index.html" class="btn">
      <span class="tag">Mode 01</span>
      <span class="label">PS4 HEN</span>
      <span class="range">FW 6.20 – 11.02</span>
      <span class="arrow">&gt;</span>
    </a>
    <a href="v2/index.html" class="btn">
      <span class="tag">Mode 02</span>
      <span class="label">PS4 HEN</span>
      <span class="range">FW 11.00 – 13.00</span>
      <span class="arrow">&gt;</span>
    </a>
  </div>
</main>

<footer>© <span id="footer-year"></span> 00962-78888-4804 - مركز المبدع</footer>

<script>
  document.getElementById('footer-year').textContent = new Date().getFullYear();
</script>
</body>
</html>
